apply plugin: 'com.android.application'

android {
    namespace 'com.daimajia.slider.demo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.daimajia.slider.demo'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':library')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // com.nineoldandroids and com.daimajia.androidanimations were jcenter-only and are gone;
    // ChildAnimationExample uses a framework ObjectAnimator instead.
}
