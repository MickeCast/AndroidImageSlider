// Top-level build file.
//
// This fork is consumed as a published AAR (JitPack), NOT as a composite build, so its AGP does
// not have to match the consuming apps'. It deliberately stays on AGP 8.x / Java 17, which is the
// newest combination JitPack's builders support. See jitpack.yml.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // PhotoView (compileOnly, for ZoomableSliderView) is published here.
        maven { url 'https://jitpack.io' }
    }
}
