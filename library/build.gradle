apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.daimajia.slider.library'
    compileSdk 36

    defaultConfig {
        // 24 is what every consuming app declares; below that nothing here is exercised any more.
        minSdk 24
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // api, not implementation: ViewPagerEx extends ViewPager and PagerAdapter appears in public
    // signatures, so a consumer compiling against this library needs them on its own classpath.
    api 'androidx.viewpager:viewpager:1.1.0'
    api 'com.squareup.picasso:picasso:2.71828'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
    // ZoomableSliderView only. compileOnly so that depending on this library does not drag
    // PhotoView into every app; an app that uses that class declares PhotoView itself.
    compileOnly 'com.github.chrisbanes:PhotoView:2.3.0'
    // PhotoView extends AppCompatImageView, so appcompat has to be on the compile classpath for
    // it to be read. Also compileOnly: nothing else here needs appcompat at runtime, and every
    // app that uses PhotoView already ships it.
    compileOnly 'androidx.appcompat:appcompat:1.7.1'

    // The suite drives real views on a device: everything here is instrumented, because a
    // SliderLayout without a Looper, a window and a Picasso is not the thing under test.
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.appcompat:appcompat:1.7.1'
    androidTestImplementation 'com.github.chrisbanes:PhotoView:2.3.0'
    androidTestImplementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
}

// JitPack passes -Pgroup=com.github.<user> and -Pversion=<tag> and then runs publishToMavenLocal,
// so those are honoured when present and fall back to the local values for a build run by hand.
// VERSION_NAME lives in gradle.properties.
publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group.toString().isEmpty() ? 'com.github.MickeCast' : project.group.toString()
            artifactId = 'AndroidImageSlider'
            version = project.version.toString() == 'unspecified' ? VERSION_NAME : project.version.toString()
            afterEvaluate {
                from components.release
            }
            pom {
                name = 'AndroidImageSlider'
                description = POM_DESCRIPTION
                url = 'https://github.com/MickeCast/AndroidImageSlider'
                licenses {
                    license {
                        name = POM_LICENCE_NAME
                        url = POM_LICENCE_URL
                    }
                }
            }
        }
    }
}
